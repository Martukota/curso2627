<!DOCTYPE html>

<html lang="es-ES">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Práctica 10 - Formularios</title>
    </head>
    
    <body>
        <h1>Formulario de inscripción</h1>
        
        <form action="">
            <!-- TODO 1: Crea un fieldset "Datos personales" con nombre (text), contraseña (password) y correo (email). Añade label y br. -->
             <fieldset>
                <legend>Datos personales</legend>
                <label for="">Nombre</label>
                <input type="text">
                <br><br>

                <label for="">Contraseña</label>
                <input type="password">
                <br><br>

                <label for="">Email</label>
                <input type="email">
                <br><br>

             </fieldset>
            <!-- TODO 2: Crea un fieldset "Curso" con un input date y otro file. -->

            <fieldset>
                <legend>Curso</legend>
                <label for="">Fecha</label>
                <input type="date">
                <br><br>

                <label for="">Nuevo documento</label>
                <input type="file">
                <br><br>

            </fieldset>

            <!-- TODO 3: Crea tres checkbox para elegir intereses: HTML, CSS y JavaScript. -->

            <fieldset>
                <legend>Intereses</legend>
                <label for="">HTML</label>
                <input type="checkbox" name="" id="">

                <label for="">CSS</label>
                <input type="checkbox" name="" id="">

                <label for="">Javascript</label>
                <input type="checkbox" name="" id="">


            </fieldset>
            <!-- TODO 4: Crea tres radio para elegir turno: mañana, tarde o noche. IMPORTANTE: deben compartir el mismo name. -->

            <fieldset>
                <legend>Turno</legend>
                <label for="">Mañana</label>
                <input type="radio" name="turno" id="">

                <label for="">Tarde</label>
                <input type="radio" name="turno" id="">


                <label for="">Noche</label>
                <input type="radio" name="turno" id="">



            </fieldset>
            <!-- TODO 5: Crea un select con tres opciones de nivel: básico, intermedio y avanzado. -->

            <fieldset>
                <legend>Nivel</legend>
                <select>
                    <option value="">Básico</option>
                    <option value="">Intermedio</option>
                    <option value="">Avanzado</option>
                </select>
            </fieldset>
            <!-- TODO 6: Añade botones submit y reset. -->
            <button type="submit">Enviar</button>
            <button type="reset">Limpiar</button>
            <!-- EXPERIMENTO: marca dos radio cuando tienen names diferentes; después dales el mismo name y vuelve a probar. Explica el cambio. -->
            <!-- RETO: añade id a todos los controles y relaciona correctamente cada label mediante for. -->
        </form>

    </body>
</html>
