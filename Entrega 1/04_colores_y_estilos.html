<!DOCTYPE html>
<html lang="es-ES">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 04 - Colores y estilos</title> 
    <style>
      /* TODO 1: Pon un color de fondo suave al body usando background-color. */
      body {background-color: beige;}
      /* TODO 2: Haz que TODOS los h1 estén centrados y sean de color verde. */
      h1 {text-align: center; color: green;}
      /* TODO 3: Haz que TODOS los párrafos usen Verdana (alternativas Geneva y sans-serif), tamaño 16px y texto justificado. */
      p {font-family: Verdana, Geneva, Tahoma, sans-serif; font-size: 16px; text-align: justify;}
    </style>
  </head>

  <body>
    <h1>Probando colores</h1>
    <!-- TODO 4: Aplica color azul a este párrafo mediante style en línea. --><p style="color: blue;">Color mediante nombre.</p>
    <!-- TODO 5: Aplica el color #dc3d1d a este párrafo. --><p style="color: #dc3d1d;">Color hexadecimal.</p>
    <!-- TODO 6: Aplica rgb(95, 233, 55) a este párrafo. --><p style="color: rgb(95,233,55);">Color RGB.</p>
    <!-- TODO 7: Aplica hsl(298, 76%, 56%) a este párrafo. --><p style="color: hsl(298, 76%, 56%);">Color HSL.</p>
    <!-- TODO 8: Pon un fondo de color a este párrafo usando background-color. --><p style="background-color: aquamarine;">Párrafo con fondo de color.</p>
    <!-- TODO 9: Crea un párrafo azul completo y, mediante span, haz que SOLO una palabra aparezca roja y en negrita. -->
     <p style="color: blue;">Este es un párrafo de <span style="color: red; font-weight: bold;">colorinchis</span>.</p>
    <!-- EXPERIMENTO: cambia el color general de p en style. Después añade style="color: ..." a uno. ¿Cuál termina mostrando? -->
    <!-- RETO: Diseña una pequeña tarjeta con h2 y dos párrafos. Usa al menos un HEX, un RGB o HSL, background-color, text-align y font-weight. -->
  </body>

</html>
