  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <body>
    <!-- PRÁCTICA 01: MI PRIMERA PÁGINA
        Objetivo: reconocer la estructura básica de HTML y utilizar etiquetas, atributos y estilos en línea. -->

    <!-- TODO 1: Cambia el título de la pestaña del navegador por: Mi primera práctica HTML. -->
    <!-- TODO 2: Convierte el texto siguiente en un párrafo. -->
    <p>Estoy aprendiendo HTML en Lenguaje de Marcas.</p>
    <!-- TODO 3: Crea otro párrafo con tu nombre y apellidos. -->
     <p>Marta Porta</p>
    <!-- TODO 4: Crea un párrafo de color rojo usando el atributo style. -->
    <p style="color: red;">Hola soy un párrafo rojo</p>
    <!-- TODO 5: Crea un párrafo azul y centrado. Recuerda que varias declaraciones CSS dentro de style se separan con ; -->
     <p style="color: blue; text-align: center;">Soy un párrafo azul y centrado</p>
    <!-- TODO 6: Crea un párrafo en negrita y cursiva usando style con font-weight y font-style. -->
     <p style="font-weight: bold; font-style: italic;">Soy un párrafo en negrita y cursiva</p>

  </body>
